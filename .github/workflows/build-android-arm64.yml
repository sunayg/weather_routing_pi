# Builds the Android arm64 plugin package, the same steps as the CircleCI
# android-arm64 job. Download the result from the run's Artifacts section.
# Started by hand only.
name: build-android-arm64

on:
  # Manual only: run it from the Actions tab (or `gh workflow run`) when an
  # Android build is wanted. It no longer runs on every push.
  workflow_dispatch:

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WEATHER_ROUTING_API_HEADER_VERSION: "1.21"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      # The runner presets these to its own preinstalled Android SDK, which the
      # disk-cleanup step removes. Let the build script download what it needs.
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-ci/android-sdk
      NDK_HOME: ""
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake curl unzip gettext python3 openjdk-17-jdk-headless
      - name: Build OpenCPN 5.14 core and the plugin for Android arm64
        run: bash ci/build-android-arm64.sh
      - name: Verify Android package ABI
        run: python3 ci/verify-package-abi.py artifacts/android-arm64/package --target android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: weather-routing-android-arm64
          path: artifacts/android-arm64
          if-no-files-found: error
